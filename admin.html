<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lofts Prime | Administração</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f6f7f9;color:#18212f}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#111827,#263449)}
.loginbox{width:min(420px,100%);background:#fff;border-radius:24px;padding:32px;box-shadow:0 25px 70px #0005}
.logo{font-size:27px;font-weight:850;letter-spacing:-.7px}.sub{color:#667085;font-size:14px;margin:5px 0 25px}
label{display:block;font-size:12px;font-weight:750;color:#475467;margin:14px 0 6px}
input,textarea,select{width:100%;border:1px solid #d8dde6;border-radius:11px;padding:12px 13px;outline:none;background:#fff}
input:focus,textarea:focus,select:focus{border-color:#667085;box-shadow:0 0 0 3px #66708518}
textarea{min-height:110px;resize:vertical}.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:750}.primary{background:#111827;color:#fff}.light{background:#fff;border:1px solid #d8dde6}.danger{background:#fee4e2;color:#b42318}
.login .primary{width:100%;margin-top:20px;padding:13px}
.notice{padding:11px 13px;border-radius:11px;font-size:13px;margin-top:12px;display:none}.ok{background:#ecfdf3;color:#067647}.err{background:#fef3f2;color:#b42318}
.app{display:none}.top{height:70px;background:#111827;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}
.brand{font-weight:850;font-size:20px}.brand small{display:block;font-size:11px;font-weight:500;opacity:.6}
.wrap{max-width:1240px;margin:auto;padding:24px}.topactions{display:flex;gap:9px;flex-wrap:wrap}.topactions .light{color:#18212f}
.hero{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:20px}.hero h1{margin:0;font-size:28px;letter-spacing:-.8px}.hero p{margin:5px 0 0;color:#667085}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.property{background:#fff;border:1px solid #e3e7ed;border-radius:20px;overflow:hidden;box-shadow:0 8px 25px #00000008;transition:.15s}
.property:hover{transform:translateY(-2px);box-shadow:0 12px 32px #00000012}
.cover{height:170px;background:linear-gradient(135deg,#e5e7eb,#f8fafc);display:grid;place-items:center;color:#98a2b3;font-size:38px}
.pbody{padding:17px}.pbody h2{font-size:18px;margin:0 0 5px}.location{font-size:13px;color:#667085}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.tag{font-size:11px;padding:5px 8px;border-radius:30px;background:#f2f4f7;color:#475467}.price{font-size:20px;font-weight:850;margin:10px 0}.price small{font-size:12px;color:#667085;font-weight:500}.pactions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.pactions button{padding:10px}
.empty{background:#fff;border:1px dashed #ccd3dd;border-radius:18px;padding:45px;text-align:center;color:#667085}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:15px;z-index:20}.modal.open{display:flex}.modalbox{background:#fff;width:min(760px,100%);max-height:94vh;overflow:auto;border-radius:22px;padding:23px}.modalhead{display:flex;justify-content:space-between;align-items:start;gap:15px}.close{background:#f2f4f7;border:0;border-radius:9px;width:36px;height:36px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px}.full{grid-column:1/-1}.formactions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px;padding-top:16px;border-top:1px solid #eaecf0}
@media(max-width:900px){.cards{grid-template-columns:1fr 1fr}}@media(max-width:620px){.top{padding:0 15px}.wrap{padding:16px}.hero{display:block}.topactions{margin-top:15px}.cards{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<section id="login" class="login">
 <div class="loginbox">
  <div class="logo">Lofts Prime</div><div class="sub">Painel administrativo</div>
  <label>E-mail</label><input id="email" type="email" autocomplete="username">
  <label>Senha</label><input id="password" type="password" autocomplete="current-password">
  <button class="btn primary" onclick="login()">Entrar no painel</button>
  <div id="loginNotice" class="notice"></div>
 </div>
</section>

<section id="app" class="app">
<header class="top"><div class="brand">Lofts Prime<small>Administração</small></div><div class="topactions"><button class="btn light" onclick="newProperty()">＋ Novo apartamento</button><button class="btn light" onclick="logout()">Sair</button></div></header>
<main class="wrap">
 <div id="notice" class="notice"></div>
 <div class="hero"><div><h1>Meus apartamentos</h1><p>Gerencie imóveis, preços e informações do site.</p></div><button class="btn light" onclick="loadData()">↻ Atualizar</button></div>
 <div id="cards" class="cards"><div class="empty">Carregando...</div></div>
</main>
</section>

<div id="modal" class="modal">
 <div class="modalbox">
  <div class="modalhead"><div><h2 id="mtitle" style="margin:0">Apartamento</h2><p style="margin:5px 0;color:#667085;font-size:13px">Dados exibidos no site público</p></div><button class="close" onclick="closeModal()">×</button></div>
  <div id="formNotice" class="notice"></div>
  <form onsubmit="save(event)">
   <input type="hidden" id="id">
   <div class="formgrid">
    <div class="full"><label>Nome do apartamento</label><input id="name" required></div>
    <div><label>Cidade / localização</label><input id="location"></div>
    <div><label>Máximo de hóspedes</label><input id="guests" type="number" min="1" value="2"></div>
    <div><label>Diária padrão (R$)</label><input id="price" type="number" min="0" step=".01" required></div>
    <div><label>Taxa de limpeza (R$)</label><input id="cleaning" type="number" min="0" step=".01" value="150"></div>
    <div class="full"><label>Descrição</label><textarea id="description"></textarea></div>
    <div class="full"><label>Link do anúncio Airbnb</label><input id="airbnb" placeholder="https://www.airbnb.com.br/rooms/..."></div>
    <div class="full"><label>Calendário iCal Airbnb</label><input id="ical" placeholder="Opcional — usado para sincronização de disponibilidade"></div>
   </div>
   <div class="formactions"><button type="button" class="btn light" onclick="closeModal()">Cancelar</button><button class="btn primary" type="submit">Salvar alterações</button></div>
  </form>
 </div>
</div>

<script>
const W='https://lofts-prime-sync.cristianohuttnerfischer.workers.dev';
let token=localStorage.getItem('lofts_prime_admin_token')||'', data={lofts:[],prices:[]};

function notice(msg,type='ok',where='notice'){let e=document.getElementById(where);e.textContent=msg;e.className='notice '+type;e.style.display='block';setTimeout(()=>e.style.display='none',4500)}
async function api(path,opt={}){opt.headers=Object.assign({'Content-Type':'application/json','Authorization':'Bearer '+token},opt.headers||{});let r=await fetch(W+path,opt),t=await r.text(),j;try{j=JSON.parse(t)}catch{throw Error(t||'Erro HTTP '+r.status)}if(!r.ok||j.ok===false)throw Error(j.error||j.message||'Erro HTTP '+r.status);return j}
async function login(){
 try{let r=await fetch(W+'/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});let j=await r.json();if(!r.ok||j.ok===false)throw Error(j.error||'Não foi possível entrar');token=j.access_token;localStorage.setItem('lofts_prime_admin_token',token);showApp();loadData()}catch(e){notice('❌ '+e.message,'err','loginNotice')}
}
function showApp(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block'}
function logout(){localStorage.removeItem('lofts_prime_admin_token');token='';location.reload()}
async function loadData(){
 try{data=await api('/admin/data');render()}catch(e){if(String(e.message).toLowerCase().includes('unauthorized')||String(e.message).includes('401')){logout();return}notice('❌ '+e.message,'err')}
}
function money(n){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(){
 let c=document.getElementById('cards');if(!data.lofts?.length){c.innerHTML='<div class="empty">Nenhum apartamento cadastrado.<br><br>Clique em “Novo apartamento”.</div>';return}
 c.innerHTML=data.lofts.map(l=>{let p=(data.prices||[]).find(x=>x.loft_id===l.id);return `<article class="property">
 <div class="cover">🏠</div><div class="pbody"><h2>${esc(l.name||'Sem nome')}</h2><div class="location">${esc(l.location||'Localização não informada')}</div>
 <div class="tags"><span class="tag">👥 ${l.max_guests||2} hóspedes</span><span class="tag">${l.active===false?'⚪ Inativo':'🟢 Ativo'}</span></div>
 <div class="price">${money(p?.price)} <small>/ diária</small></div>
 <div class="pactions"><button class="btn primary" onclick="edit('${l.id}')">Editar apartamento</button><button class="btn light" onclick="photos()">📷 Fotos</button></div>
 </div></article>`}).join('')
}
function fill(l){let p=(data.prices||[]).find(x=>x.loft_id===l.id);document.getElementById('id').value=l.id||'';document.getElementById('name').value=l.name||'';document.getElementById('location').value=l.location||'';document.getElementById('guests').value=l.max_guests||2;document.getElementById('price').value=p?.price??0;document.getElementById('cleaning').value=l.cleaning_fee??150;document.getElementById('description').value=l.description||'';document.getElementById('airbnb').value=l.airbnb_url||'';document.getElementById('ical').value=''}
function edit(id){let l=data.lofts.find(x=>x.id===id);if(!l)return;document.getElementById('mtitle').textContent='Editar apartamento';fill(l);openModal()}
function newProperty(){document.getElementById('mtitle').textContent='Novo apartamento';fill({});document.getElementById('id').value='';openModal()}
async function save(ev){ev.preventDefault();let currentId=document.getElementById('id').value||null;let body={loft_id:currentId,name:document.getElementById('name').value.trim(),location:document.getElementById('location').value.trim(),max_guests:Number(document.getElementById('guests').value||2),cleaning_fee:Number(document.getElementById('cleaning').value||0),description:document.getElementById('description').value.trim(),airbnb_url:document.getElementById('airbnb').value.trim()};try{let r=await api('/admin/loft',{method:'POST',body:JSON.stringify(body)});let id=r.loft?.id||r.loft_id||r.id||currentId;if(!id)throw Error('O banco não retornou o ID do apartamento');await api('/admin/price',{method:'POST',body:JSON.stringify({loft_id:id,price:Number(document.getElementById('price').value||0)})});let ical=document.getElementById('ical').value.trim();if(ical)await api('/admin/channel-calendar',{method:'POST',body:JSON.stringify({loft_id:id,channel:'Airbnb',calendar_url:ical})});closeModal();notice('✅ Alterações salvas no banco de dados.');await loadData()}catch(e){notice('❌ '+e.message,'err','formNotice')}}
function openModal(){document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function photos(){notice('📷 A próxima etapa será o gerenciamento real de fotos pelo Supabase Storage.')}
if(token){showApp();loadData()}
</script>
</body></html>
