<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lofts Prime — Painel</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f6f8;color:#17202a}header{background:#111827;color:#fff;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}header strong{font-size:20px}header span{font-size:13px;opacity:.75}main{max-width:1200px;margin:auto;padding:20px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}.toolbar button{min-height:44px}button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:#111827;color:#fff}.secondary{background:#fff;border:1px solid #d8dde5}.danger{background:#fee2e2;color:#991b1b}.danger-outline{background:#fff;border:1px solid #f04438;color:#b42318}.card{background:#fff;border:1px solid #e2e6ec;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 3px 12px #00000008}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}@media(max-width:900px){.grid{grid-template-columns:1fr}}h2{margin:0 0 5px;font-size:19px}.muted{color:#667085;font-size:13px}.price{font-size:20px;font-weight:800;margin:12px 0}label{display:block;font-size:12px;font-weight:700;margin:12px 0 5px;color:#475467}input,textarea,select{width:100%;padding:11px;border:1px solid #d5dae2;border-radius:9px;font:inherit}textarea{min-height:90px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#ecfdf3;color:#087443;font-size:12px;font-weight:700}.badge.inactive{background:#f2f4f7;color:#667085}.badge.red{background:#fee2e2;color:#b42318}.reservation{border:1px solid #e2e6ec;border-radius:14px;padding:14px;margin:10px 0;background:#fff}.reservation.pending{border-left:5px solid #d97706}.reservation.confirmed{border-left:5px solid #087443}.reservation.rejected,.reservation.cancelled{border-left:5px solid #b42318;opacity:.9}.reservation-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;font-size:13px}@media(max-width:700px){.row,.reservation-grid{grid-template-columns:1fr}.toolbar{display:grid;grid-template-columns:1fr 1fr}.toolbar button{width:100%}.toolbar .primary:first-child{grid-column:1/-1}}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:50}.modal.open{display:flex}.box{background:#fff;border-radius:18px;width:min(780px,100%);max-height:92vh;overflow:auto;padding:22px}.notice{padding:11px 13px;border-radius:10px;margin-bottom:12px;font-size:13px;display:none}.ok{background:#ecfdf3;color:#087443}.err{background:#fef2f2;color:#b42318}.empty{text-align:center;padding:35px;color:#667085}.photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.photo{position:relative;border-radius:12px;overflow:hidden;background:#eee;aspect-ratio:1}.photo img{width:100%;height:100%;object-fit:cover}.photo button{position:absolute;right:5px;top:5px;padding:6px 8px;background:#fff;color:#b42318}.import-preview{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:10px}.import-preview img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}.calendar-item{border:1px solid #e2e6ec;border-radius:12px;padding:12px;margin:8px 0}.calendar-item code{word-break:break-all;font-size:11px}.event-list{max-height:220px;overflow:auto}.small-btn{padding:7px 10px;font-size:12px}
.login-wrap{position:fixed;inset:0;background:#f5f6f8;display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}.login-card{width:min(420px,100%);background:#fff;border:1px solid #e2e6ec;border-radius:18px;padding:24px;box-shadow:0 12px 40px #00000012}.login-card h1{margin:0 0 6px}.login-card p{color:#667085;font-size:13px}.login-card .primary{width:100%;margin-top:14px}.login-error{color:#b42318;font-size:13px;margin-top:10px;min-height:18px}
</style>
</head>
<body>
<div id="loginScreen" class="login-wrap"><div class="login-card"><h1>Lofts Prime</h1><p>Acesso ao painel administrativo</p><label>E-mail</label><input id="loginEmail" type="email"><label>Senha</label><input id="loginPassword" type="password"><div id="loginError" class="login-error"></div><button class="primary" onclick="loginAdmin()">Entrar</button></div></div>
<header><div><strong>Lofts Prime</strong><br><span>Painel administrativo</span></div><span id="status">Conectando...</span></header>
<main><div id="notice" class="notice"></div><div class="toolbar"><button class="primary" onclick="newLoft()">＋ Novo apartamento</button><button class="secondary" onclick="importAirbnb()">↗ Importar anúncio do Airbnb</button><button class="secondary" onclick="showReservations()">📋 Solicitações de reserva</button><button class="secondary" onclick="loadData()">↻ Atualizar</button><button class="secondary" onclick="logout()">Sair</button></div><div id="reservationsPanel"></div><div id="lofts" class="grid"><div class="empty">Carregando...</div></div></main>

<div id="modal" class="modal"><div class="box"><h2 id="modalTitle">Novo apartamento</h2><div id="formNotice" class="notice"></div><form onsubmit="saveLoft(event)"><input type="hidden" id="loftId"><input type="hidden" id="importedPhotos"><label>Nome do apartamento</label><input id="name" required><label>Descrição</label><textarea id="description"></textarea><div class="row"><div><label>Cidade / localização</label><input id="location"></div><div><label>Máximo de hóspedes</label><input id="maxGuests" type="number" min="1" value="2"></div></div><div class="row"><div><label>Diária padrão (R$)</label><input id="price" type="number" min="0" step=".01" required></div><div><label>Taxa de limpeza (R$)</label><input id="cleaning" type="number" min="0" step=".01" value="150"></div></div><label>Link do anúncio Airbnb</label><input id="airbnbUrl" placeholder="https://www.airbnb.com.br/rooms/..."><label>URL do calendário iCal Airbnb</label><input id="icalUrl" placeholder="Cole o link exportado no Airbnb"><div class="actions"><button class="primary" type="submit">💾 Salvar</button><button class="secondary" type="button" onclick="closeModal()">Cancelar</button></div></form></div></div>

<div id="importModal" class="modal"><div class="box"><h2>Importar anúncio do Airbnb</h2><div id="importNotice" class="notice"></div><label>Link do anúncio Airbnb</label><input id="importUrl" placeholder="https://www.airbnb.com.br/rooms/..."><div class="actions"><button class="primary" onclick="readAirbnb()">🔎 Ler anúncio</button><button class="secondary" onclick="closeImport()">Cancelar</button></div><div id="importResult"></div></div></div>

<div id="photosModal" class="modal"><div class="box"><h2 id="photosTitle">Fotos</h2><div id="photosNotice" class="notice"></div><label>Adicionar fotos</label><input id="photoFiles" type="file" accept="image/*" multiple><div class="actions"><button class="primary" onclick="uploadPhotos()">⬆ Enviar fotos</button><button class="secondary" onclick="closePhotos()">Fechar</button></div><div id="photoGrid" class="photo-grid" style="margin-top:16px"></div></div></div>

<div id="calendarModal" class="modal"><div class="box"><h2 id="calendarTitle">Calendário</h2><div id="calendarNotice" class="notice"></div><label>URL do calendário iCal</label><input id="calendarUrl" placeholder="https://www.airbnb.com/calendar/ical/..."><div class="actions"><button class="primary" onclick="saveCalendar()">💾 Salvar calendário</button><button class="secondary" onclick="syncCalendar()">↻ Sincronizar agora</button><button class="secondary" onclick="closeCalendar()">Fechar</button></div><div id="calendarList" style="margin-top:16px"></div></div></div>

<script>
const WORKER='https://lofts-prime-sync.cristianohuttnerfischer.workers.dev';
let token=localStorage.getItem('lofts_prime_admin_token')||'';let data={lofts:[],prices:[],channel_calendars:[],blocked_dates:[]};let reservations=[];let currentPhotoLoft=null;let currentCalendarLoft=null;let importedPhotos=[];
const $=id=>document.getElementById(id);
function show(msg,type='ok',target='notice'){const e=$(target);e.textContent=msg;e.className='notice '+type;e.style.display='block';setTimeout(()=>e.style.display='none',5000)}
async function api(path,opts={}){const h=Object.assign({'Authorization':'Bearer '+token},opts.headers||{});if(!(opts.body instanceof FormData))h['Content-Type']='application/json';opts.headers=h;const r=await fetch(WORKER+path,opts);const t=await r.text();let j;try{j=JSON.parse(t)}catch{throw new Error(t||('HTTP '+r.status))}if(!r.ok||j.ok===false)throw new Error(j.error||j.message||('HTTP '+r.status));return j}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function showLogin(){ $('loginScreen').style.display='flex'}function hideLogin(){$('loginScreen').style.display='none'}
async function loginAdmin(){const email=$('loginEmail').value.trim(),password=$('loginPassword').value,out=$('loginError');out.textContent='Entrando...';try{const r=await fetch(WORKER+'/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw new Error(j.error||'Falha no login');token=j.access_token||'';localStorage.setItem('lofts_prime_admin_token',token);out.textContent='';hideLogin();await loadData()}catch(e){out.textContent=e.message||String(e)}}
async function loadData(){if(!token){showLogin();return}try{data=await api('/admin/data');$('status').textContent='● Conectado';render()}catch(e){$('status').textContent='Erro de conexão';if(/401|Unauthorized|Sessão/i.test(e.message)){token='';localStorage.removeItem('lofts_prime_admin_token');showLogin()}show(e.message,'err')}}
function render(){const el=$('lofts');if(!data.lofts?.length){el.innerHTML='<div class="empty">Nenhum apartamento cadastrado.</div>';return}el.innerHTML=data.lofts.map(l=>{const p=(data.prices||[]).find(x=>x.loft_id===l.id);const n=Number(p?.nightly_price??p?.price??0);return `<div class="card"><span class="badge ${l.active===false?'inactive':''}">${l.active===false?'Inativo':'Ativo'}</span><h2 style="margin-top:10px">${esc(l.name||'Sem nome')}</h2><div class="muted">${esc(l.location||'Localização não informada')}</div><div class="price">${Number.isFinite(n)?'R$ '+n.toFixed(2).replace('.',','):'Preço não cadastrado'} <small class="muted">/ diária</small></div><div class="muted">Até ${l.max_guests||2} hóspedes · Limpeza R$ ${Number(l.cleaning_fee??150).toFixed(2).replace('.',',')}</div><div class="actions"><button class="primary" onclick='editLoft(${JSON.stringify(l)})'>Editar</button><button class="secondary" onclick='openPhotos("${l.id}",${JSON.stringify(l.name||'')})'>Fotos</button><button class="secondary" onclick='openCalendar("${l.id}",${JSON.stringify(l.name||'')})'>Calendário</button><button class="${l.active===false?'primary':'secondary'}" onclick='toggleLoft("${l.id}",${l.active===false})'>${l.active===false?'✓ Ativar':'⏸ Desativar'}</button><button class="danger-outline" onclick='deleteLoft("${l.id}",${JSON.stringify(l.name||'')})'>🗑 Excluir</button></div></div>`}).join('')}
function openModal(){$('modal').classList.add('open')}function closeModal(){$('modal').classList.remove('open')}
function newLoft(){importedPhotos=[];$('modalTitle').textContent='Novo apartamento';$('loftId').value='';$('name').value='';$('description').value='';$('location').value='';$('maxGuests').value=2;$('price').value=0;$('cleaning').value=150;$('airbnbUrl').value='';$('icalUrl').value='';$('importedPhotos').value='';openModal()}
function editLoft(l){importedPhotos=Array.isArray(l.photos)?l.photos.slice():[];$('modalTitle').textContent='Editar apartamento';$('loftId').value=l.id;$('name').value=l.name||'';$('description').value=l.description||'';$('location').value=l.location||'';$('maxGuests').value=l.max_guests||2;const p=(data.prices||[]).find(x=>x.loft_id===l.id);$('price').value=Number(p?.nightly_price??p?.price??0);$('cleaning').value=l.cleaning_fee??150;$('airbnbUrl').value=l.airbnb_url||'';$('icalUrl').value='';$('importedPhotos').value=JSON.stringify(importedPhotos);openModal()}
async function saveLoft(ev){ev.preventDefault();const id=$('loftId').value;const body={loft_id:id||null,name:$('name').value.trim(),description:$('description').value.trim(),location:$('location').value.trim(),max_guests:Number($('maxGuests').value||2),cleaning_fee:Number($('cleaning').value||0),airbnb_url:$('airbnbUrl').value.trim(),photos:importedPhotos};try{const r=await api('/admin/loft',{method:'POST',body:JSON.stringify(body)});const loftId=r.loft?.id||id;const price=Number($('price').value||0);if(loftId)await api('/admin/price',{method:'POST',body:JSON.stringify({loft_id:loftId,nightly_price:price})});const ical=$('icalUrl').value.trim();if(ical&&loftId)await api('/admin/channel-calendar',{method:'POST',body:JSON.stringify({loft_id:loftId,channel:'Airbnb',calendar_url:ical})});closeModal();show(id?'✅ Alterações salvas.':'✅ Apartamento importado/criado com sucesso.','ok');await loadData()}catch(e){show('❌ '+e.message,'err','formNotice')}}
function importAirbnb(){$('importUrl').value='';$('importResult').innerHTML='';$('importNotice').style.display='none';$('importModal').classList.add('open');$('importUrl').focus()}function closeImport(){$('importModal').classList.remove('open')}
async function readAirbnb(){const url=$('importUrl').value.trim();if(!url)return show('Cole o link do anúncio Airbnb.','err','importNotice');show('Lendo anúncio do Airbnb...','ok','importNotice');try{const r=await api('/admin/airbnb-import',{method:'POST',body:JSON.stringify({url})});const x=r.listing;importedPhotos=x.photos||[];$('importResult').innerHTML=`<div class="card" style="margin-top:14px"><b>Dados encontrados</b><label>Nome</label><input id="impName" value="${esc(x.name||'')}"><label>Descrição</label><textarea id="impDesc">${esc(x.description||'')}</textarea><div class="row"><div><label>Cidade/localização</label><input id="impLoc" value="${esc(x.location||'')}"></div><div><label>Máximo de hóspedes</label><input id="impGuests" type="number" value="${Number(x.max_guests||2)}"></div></div><label>Fotos encontradas: ${importedPhotos.length}</label><div class="import-preview">${importedPhotos.slice(0,10).map(u=>`<img src="${esc(u)}" onerror="this.style.display='none'">`).join('')}</div><div class="actions"><button class="primary" onclick="useImported()">✓ Usar dados e abrir cadastro</button></div></div>`;show('Dados encontrados. Confira e clique em Usar dados.','ok','importNotice')}catch(e){show('❌ '+e.message,'err','importNotice')}}
function useImported(){const u=$('importUrl').value.trim();$('modalTitle').textContent='Novo apartamento — importado do Airbnb';$('loftId').value='';$('name').value=$('impName')?.value||'';$('description').value=$('impDesc')?.value||'';$('location').value=$('impLoc')?.value||'';$('maxGuests').value=$('impGuests')?.value||2;$('price').value=0;$('cleaning').value=150;$('airbnbUrl').value=u;$('icalUrl').value='';$('importedPhotos').value=JSON.stringify(importedPhotos);closeImport();openModal()}
async function toggleLoft(id,activate){if(!confirm(activate?'Reativar este anúncio e exibi-lo novamente no site?':'Desativar este anúncio temporariamente? Ele permanecerá no painel, mas não deverá aparecer no site.'))return;try{await api('/admin/loft',{method:'POST',body:JSON.stringify({loft_id:id,active:activate})});show(activate?'✅ Anúncio ativado.':'⏸ Anúncio desativado e retirado do site.','ok');await loadData()}catch(e){show('❌ '+e.message,'err')}}
async function deleteLoft(id,name){if(!confirm(`Excluir permanentemente${name?' "'+name+'"':''}?\n\nSe houver reservas vinculadas, o sistema bloqueará a exclusão para preservar o histórico.`))return;try{await api('/admin/loft?id='+encodeURIComponent(id),{method:'DELETE'});show('🗑 Anúncio excluído.','ok');await loadData()}catch(e){show('❌ '+e.message,'err')}}
async function openPhotos(id,name){currentPhotoLoft=id;$('photosTitle').textContent='Fotos — '+name;$('photoFiles').value='';$('photosModal').classList.add('open');renderPhotos((data.lofts.find(x=>x.id===id)||{}).photos||[])}
function closePhotos(){$('photosModal').classList.remove('open')}
function renderPhotos(list){$('photoGrid').innerHTML=(list||[]).length?(list||[]).map(u=>`<div class="photo"><img src="${esc(u)}"><button onclick='deletePhoto(${JSON.stringify(u)})'>✕</button></div>`).join(''):'<div class="empty" style="grid-column:1/-1">Nenhuma foto cadastrada.</div>'}
async function uploadPhotos(){const files=[...$('photoFiles').files];if(!currentPhotoLoft||!files.length)return show('Selecione pelo menos uma foto.','err','photosNotice');try{for(const file of files){const fd=new FormData();fd.append('loft_id',currentPhotoLoft);fd.append('file',file);await api('/admin/photo',{method:'POST',body:fd})}show('✅ Fotos enviadas.','ok','photosNotice');await loadData();renderPhotos((data.lofts.find(x=>x.id===currentPhotoLoft)||{}).photos||[])}catch(e){show('❌ '+e.message,'err','photosNotice')}}
async function deletePhoto(url){if(!confirm('Excluir esta foto?'))return;try{await api('/admin/photo',{method:'DELETE',body:JSON.stringify({loft_id:currentPhotoLoft,url})});await loadData();renderPhotos((data.lofts.find(x=>x.id===currentPhotoLoft)||{}).photos||[])}catch(e){show('❌ '+e.message,'err','photosNotice')}}
async function openCalendar(id,name){currentCalendarLoft=id;$('calendarTitle').textContent='Calendário — '+name;$('calendarUrl').value='';$('calendarModal').classList.add('open');await loadCalendarPanel()}
function closeCalendar(){$('calendarModal').classList.remove('open')}
async function loadCalendarPanel(){try{const j=await api('/admin/calendar?loft_id='+encodeURIComponent(currentCalendarLoft));$('calendarList').innerHTML=(j.calendars||[]).map(c=>`<div class="calendar-item"><b>${esc(c.channel||'Calendário')}</b><br><code>${esc(c.calendar_url||'')}</code><div class="actions"><button class="danger small-btn" onclick='deleteCalendar("${c.id}")'>Excluir calendário</button></div></div>`).join('')||'<div class="empty">Nenhum calendário cadastrado.</div>';if(j.events?.length)$('calendarList').innerHTML+=`<h3>Eventos sincronizados</h3><div class="event-list">${j.events.map(e=>`<div class="calendar-item"><b>${esc(e.start_date||'')} → ${esc(e.end_date||'')}</b><br><span class="muted">${esc(e.summary||e.channel||'Airbnb')}</span></div>`).join('')}</div>`}catch(e){show('❌ '+e.message,'err','calendarNotice')}}
async function saveCalendar(){const url=$('calendarUrl').value.trim();if(!url)return show('Informe a URL iCal.','err','calendarNotice');try{await api('/admin/channel-calendar',{method:'POST',body:JSON.stringify({loft_id:currentCalendarLoft,channel:'Airbnb',calendar_url:url})});show('✅ Calendário salvo.','ok','calendarNotice');await loadCalendarPanel()}catch(e){show('❌ '+e.message,'err','calendarNotice')}}
async function deleteCalendar(id){if(!confirm('Excluir este calendário da sincronização?'))return;try{await api('/admin/channel-calendar?id='+encodeURIComponent(id),{method:'DELETE'});await loadCalendarPanel()}catch(e){show('❌ '+e.message,'err','calendarNotice')}}
async function syncCalendar(){try{show('Sincronizando calendários...','ok','calendarNotice');const j=await api('/sync',{method:'POST'});show(`✅ Sincronização concluída. ${j.events||0} evento(s) encontrados.`,'ok','calendarNotice');await loadCalendarPanel()}catch(e){show('❌ '+e.message,'err','calendarNotice')}}
async function showReservations(){try{const j=await api('/admin/reservations');reservations=j.reservations||[];$('reservationsPanel').innerHTML=`<div class="card"><h2>Solicitações de reserva</h2><div class="muted" style="margin-bottom:12px">Somente reservas confirmadas bloqueiam as datas. A confirmação também verifica sobreposição no mesmo loft.</div>${reservations.length?reservations.map(renderReservation).join(''):'<div class="empty">Nenhuma solicitação encontrada.</div>'}</div>`}catch(e){show('❌ '+e.message,'err')}}
function renderReservation(r){const g=r.guests||{},l=r.lofts||{},s=r.status||'pending',label={pending:'Pendente',confirmed:'Confirmada',rejected:'Recusada',cancelled:'Cancelada'}[s]||s,total=Number(r.total_amount||0).toFixed(2).replace('.',','),ci=r.check_in?String(r.check_in).split('-').reverse().join('/'):'',co=r.check_out?String(r.check_out).split('-').reverse().join('/'):'',red=(s==='cancelled'||s==='rejected');return `<div class="reservation ${esc(s)}"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><div><b>#${esc(r.id)}</b> · <span class="badge ${red?'red':''}">${esc(label)}</span></div><b>R$ ${total}</b></div><div class="reservation-grid" style="margin-top:10px"><div><b>Loft:</b> ${esc(l.name||r.loft_id)}</div><div><b>Período:</b> ${ci} → ${co}</div><div><b>Hóspede:</b> ${esc(g.name||'')}</div><div><b>WhatsApp:</b> ${esc(g.phone||'')}</div><div><b>E-mail:</b> ${esc(g.email||'')}</div><div><b>CPF:</b> ${esc(g.document||'')}</div><div><b>Hóspedes:</b> ${esc(r.guests_count||'')}</div><div><b>Pagamento:</b> ${esc(r.payment_method||'Aguardando')}</div></div>${r.notes?`<div class="muted" style="margin-top:8px"><b>Observações:</b> ${esc(r.notes)}</div>`:''}<div class="actions">${s==='pending'?`<button class="primary" onclick="confirmReservation('${r.id}','pix')">✓ Confirmar Pix</button><button class="primary" onclick="confirmReservation('${r.id}','nubank')">✓ Confirmar Nubank</button><button class="danger" onclick="rejectReservation('${r.id}')">Recusar</button>`:''}${s==='confirmed'?`<button class="danger" onclick="cancelReservation('${r.id}')">Cancelar reserva</button><button class="danger-outline" onclick="deleteReservation('${r.id}')">🗑 Excluir</button>`:''}${(s==='cancelled'||s==='rejected')?`<button class="danger-outline" onclick="deleteReservation('${r.id}')">🗑 Excluir registro</button>`:''}</div></div>`}
async function confirmReservation(id,method){if(!confirm('Confirmar pagamento e bloquear as datas?'))return;try{await api('/admin/reservation',{method:'PATCH',body:JSON.stringify({reservation_id:id,status:'confirmed',payment_method:method})});show('✅ Reserva confirmada.','ok');await showReservations()}catch(e){show('❌ '+e.message,'err')}}
async function rejectReservation(id){if(!confirm('Recusar esta solicitação? As datas continuarão disponíveis.'))return;try{await api('/admin/reservation',{method:'PATCH',body:JSON.stringify({reservation_id:id,status:'rejected'})});show('Solicitação cancelada.','ok');await showReservations()}catch(e){show('❌ '+e.message,'err')}}
async function cancelReservation(id){if(!confirm('Cancelar esta reserva confirmada? As datas serão liberadas.'))return;try{await api('/admin/reservation',{method:'PATCH',body:JSON.stringify({reservation_id:id,status:'cancelled'})});show('Reserva cancelada e datas liberadas.','ok');await showReservations()}catch(e){show('❌ '+e.message,'err')}}
async function deleteReservation(id){if(!confirm('Excluir permanentemente este registro de reserva?'))return;try{await api('/admin/reservation?id='+encodeURIComponent(id),{method:'DELETE'});show('🗑 Registro excluído.','ok');await showReservations()}catch(e){show('❌ '+e.message,'err')}}
function logout(){token='';localStorage.removeItem('lofts_prime_admin_token');showLogin();$('status').textContent='Aguardando login'}
loadData();
</script>
</body></html>
