<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lofts Prime — Painel</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f6f8;color:#17202a}
header{background:#111827;color:#fff;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
header strong{font-size:20px}header span{font-size:13px;opacity:.75}
main{max-width:1180px;margin:auto;padding:20px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.toolbar button{min-height:44px}
@media(max-width:700px){.toolbar{display:grid;grid-template-columns:1fr 1fr}.toolbar button{width:100%}.toolbar .primary{grid-column:1/-1}}
button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}
.primary{background:#111827;color:#fff}.secondary{background:#fff;border:1px solid #d8dde5}.danger{background:#fee2e2;color:#991b1b}
.card{background:#fff;border:1px solid #e2e6ec;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 3px 12px #00000008}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:850px){.grid{grid-template-columns:1fr}}
h2{margin:0 0 5px;font-size:19px}.muted{color:#667085;font-size:13px}.price{font-size:20px;font-weight:800;margin:12px 0}
label{display:block;font-size:12px;font-weight:700;margin:12px 0 5px;color:#475467}
input,textarea,select{width:100%;padding:11px;border:1px solid #d5dae2;border-radius:9px;font:inherit}
textarea{min-height:90px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#ecfdf3;color:#087443;font-size:12px;font-weight:700}.badge.inactive{background:#f2f4f7;color:#667085}.danger-outline{background:#fff;border:1px solid #f04438;color:#b42318}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.open{display:flex}.box{background:#fff;border-radius:18px;width:min(700px,100%);max-height:92vh;overflow:auto;padding:22px}
.notice{padding:11px 13px;border-radius:10px;margin-bottom:12px;font-size:13px;display:none}.ok{background:#ecfdf3;color:#087443}.err{background:#fef2f2;color:#b42318}
.spinner{opacity:.65}.empty{text-align:center;padding:35px;color:#667085}
.reservation{border:1px solid #e2e6ec;border-radius:14px;padding:14px;margin:10px 0;background:#fff}
.reservation.pending{border-left:5px solid #d97706}.reservation.confirmed{border-left:5px solid #087443}
.reservation.rejected,.reservation.cancelled{border-left:5px solid #b42318;opacity:.8}
.reservation-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;font-size:13px}
@media(max-width:700px){.reservation-grid{grid-template-columns:1fr}}


.login-wrap{position:fixed;inset:0;background:#f5f6f8;display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}.login-card{width:min(420px,100%);background:#fff;border:1px solid #e2e6ec;border-radius:18px;padding:24px;box-shadow:0 12px 40px #00000012}.login-card h1{margin:0 0 6px}.login-card p{color:#667085;font-size:13px}.login-card .primary{width:100%;margin-top:14px}.login-error{color:#b42318;font-size:13px;margin-top:10px;min-height:18px}
</style>
</head>
<body>
<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    <h1>Lofts Prime</h1>
    <p>Acesso ao painel administrativo</p>
    <label>E-mail</label><input id="loginEmail" type="email" autocomplete="username">
    <label>Senha</label><input id="loginPassword" type="password" autocomplete="current-password">
    <div id="loginError" class="login-error"></div>
    <button class="primary" onclick="loginAdmin()">Entrar</button>
  </div>
</div>
<header><div><strong>Lofts Prime</strong><br><span>Painel administrativo</span></div><span id="status">Conectando...</span></header>
<main>
  <div id="notice" class="notice"></div>
  <div class="toolbar">
    <button class="primary" onclick="newLoft()">＋ Novo apartamento</button>
    <button class="secondary" onclick="importAirbnb()">↗ Importar anúncio do Airbnb</button>
    <button class="secondary" onclick="showReservations()">📋 Solicitações de reserva</button>
    <button class="secondary" onclick="loadData()">↻ Atualizar</button>
    <button class="secondary" onclick="logout()">Sair</button>
  </div>
  <div id="reservationsPanel"></div>
  <div id="lofts" class="grid"><div class="empty">Carregando...</div></div>
</main>

<div id="modal" class="modal">
 <div class="box">
  <h2 id="modalTitle">Novo apartamento</h2>
  <div id="formNotice" class="notice"></div>
  <form onsubmit="saveLoft(event)">
   <input type="hidden" id="loftId">
   <label>Nome do apartamento</label><input id="name" required>
   <label>Descrição</label><textarea id="description"></textarea>
   <div class="row">
    <div><label>Cidade / localização</label><input id="location"></div>
    <div><label>Máximo de hóspedes</label><input id="maxGuests" type="number" min="1" value="2"></div>
   </div>
   <div class="row">
    <div><label>Diária padrão (R$)</label><input id="price" type="number" min="0" step=".01" required></div>
    <div><label>Taxa de limpeza (R$)</label><input id="cleaning" type="number" min="0" step=".01" value="150"></div>
   </div>
   <label>Link do anúncio Airbnb</label><input id="airbnbUrl" placeholder="https://www.airbnb.com.br/rooms/...">
   <label>URL do calendário iCal Airbnb (opcional)</label><input id="icalUrl" placeholder="Cole aqui somente se quiser cadastrar um calendário novo">
   <div class="actions">
    <button class="primary" type="submit">💾 Salvar alterações</button>
    <button class="secondary" type="button" onclick="closeModal()">Cancelar</button>
   </div>
  </form>
 </div>
</div>

<script>
const WORKER='https://lofts-prime-sync.cristianohuttnerfischer.workers.dev';
let token=localStorage.getItem('lofts_prime_admin_token')||'';
let data={lofts:[],prices:[],settings:[]}; let reservations=[];

function show(msg,type='ok',target='notice'){
 const e=document.getElementById(target);e.textContent=msg;e.className='notice '+type;e.style.display='block';
 setTimeout(()=>e.style.display='none',4000);
}
async function api(path,opts={}){
 opts.headers=Object.assign({'Content-Type':'application/json','Authorization':'Bearer '+token},opts.headers||{});
 const r=await fetch(WORKER+path,opts);
 const t=await r.text();let j;try{j=JSON.parse(t)}catch{throw new Error(t||('HTTP '+r.status))}
 if(!r.ok||j.ok===false) throw new Error(j.error||j.message||('HTTP '+r.status));
 return j;
}
function showLogin(){document.getElementById('loginScreen').style.display='flex';}
function hideLogin(){document.getElementById('loginScreen').style.display='none';}
async function loginAdmin(){
 const email=document.getElementById('loginEmail').value.trim();
 const password=document.getElementById('loginPassword').value;
 const out=document.getElementById('loginError');
 out.textContent='Entrando...';
 try{
  const r=await fetch(WORKER+'/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||!j.ok) throw new Error(j.error||'Falha no login');
  token=j.access_token||'';
  if(!token) throw new Error('O servidor não retornou o token de acesso.');
  localStorage.setItem('lofts_prime_admin_token',token);
  out.textContent=''; hideLogin(); await loadData();
 }catch(e){out.textContent=e.message||String(e);}
}

async function loadData(){
 if(!token){showLogin();return}
 try{
  const j=await api('/admin/data');data=j;
  document.getElementById('status').textContent='● Conectado';
  render();
 }catch(e){
  document.getElementById('status').textContent='Erro de conexão';
  if(/401|Sessão|Unauthorized/i.test(String(e.message||e))){token='';localStorage.removeItem('lofts_prime_admin_token');showLogin();}
  show(e.message,'err');
 }
}
function render(){
 const el=document.getElementById('lofts');
 if(!data.lofts?.length){el.innerHTML='<div class="empty">Nenhum apartamento cadastrado.</div>';return}
 el.innerHTML=data.lofts.map(l=>{
  const p=(data.prices||[]).find(x=>x.loft_id===l.id);
  const rawPrice=p?.nightly_price ?? p?.price;
  const price=Number(rawPrice);
  const priceText=Number.isFinite(price)
    ? `R$ ${price.toFixed(2).replace('.',',')}`
    : 'Preço não cadastrado';
  return `<div class="card">
    <span class="badge ${l.active===false?'inactive':''}">${l.active===false?'Inativo':'Ativo'}</span>
    <h2 style="margin-top:10px">${esc(l.name||'Sem nome')}</h2>
    <div class="muted">${esc(l.location||'Localização não informada')}</div>
    <div class="price">${priceText} <small class="muted">/ diária</small></div>
    <div class="muted">Até ${l.max_guests||2} hóspedes · Limpeza R$ ${Number(l.cleaning_fee??150).toFixed(2).replace('.',',')}</div>
    <div class="actions">
      <button class="primary" onclick='editLoft(${JSON.stringify(l)})'>Editar</button>
      <button class="secondary" onclick='photosSoon("${l.id}")'>Fotos</button>
      <button class="secondary" onclick='calendarSoon("${l.id}")'>Calendário</button>
      <button class="${l.active===false?'primary':'secondary'}" onclick='toggleLoft("${l.id}",${l.active===false})'>${l.active===false?'✓ Ativar anúncio':'⏸ Desativar anúncio'}</button>
      <button class="danger-outline" onclick='deleteLoft("${l.id}",${JSON.stringify(l.name||'')})'>🗑 Excluir</button>
    </div>
  </div>`;
 }).join('');
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function openModal(){document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function newLoft(){
 document.getElementById('modalTitle').textContent='Novo apartamento';
 ['loftId','name','description','location','airbnbUrl','icalUrl'].forEach(id=>document.getElementById(id).value='');
 document.getElementById('maxGuests').value=2;document.getElementById('price').value=0;document.getElementById('cleaning').value=150;
 openModal();
}
function editLoft(l){
 document.getElementById('modalTitle').textContent='Editar apartamento';
 document.getElementById('loftId').value=l.id||'';
 document.getElementById('name').value=l.name||'';
 document.getElementById('description').value=l.description||'';
 document.getElementById('location').value=l.location||'';
 document.getElementById('maxGuests').value=l.max_guests||2;
 const p=(data.prices||[]).find(x=>x.loft_id===l.id);
 document.getElementById('price').value=p?Number(p.nightly_price ?? p.price ?? 0):0;
 document.getElementById('cleaning').value=l.cleaning_fee??150;
 document.getElementById('airbnbUrl').value=l.airbnb_url||'';
 document.getElementById('icalUrl').value='';
 openModal();
}
async function saveLoft(ev){
 ev.preventDefault();
 const id=document.getElementById('loftId').value;
 const body={
  id:id||null,name:document.getElementById('name').value.trim(),
  description:document.getElementById('description').value.trim(),
  location:document.getElementById('location').value.trim(),
  max_guests:Number(document.getElementById('maxGuests').value||2),
  cleaning_fee:Number(document.getElementById('cleaning').value||0),
  airbnb_url:document.getElementById('airbnbUrl').value.trim()
 };
 try{
  const r=await api('/admin/loft',{method:'POST',body:JSON.stringify(body)});
  const loftId=r.loft?.id||r.id||id;
  const price=Number(document.getElementById('price').value||0);
  if(loftId && Number.isFinite(price) && price>=0)
    await api('/admin/price',{method:'POST',body:JSON.stringify({loft_id:loftId,nightly_price:price})});
  const ical=document.getElementById('icalUrl').value.trim();
  if(ical && loftId){
    await api('/admin/channel-calendar',{method:'POST',body:JSON.stringify({loft_id:loftId,channel:'Airbnb',calendar_url:ical})});
  }
  closeModal();show(id?'✅ Alterações salvas no banco.':'✅ Apartamento criado e salvo no banco.','ok');await loadData();
 }catch(e){show('❌ '+e.message,'err','formNotice')}
}
function importAirbnb(){
 document.getElementById('modalTitle').textContent='Importar anúncio do Airbnb';
 ['loftId','name','description','location','airbnbUrl','icalUrl'].forEach(id=>document.getElementById(id).value='');
 document.getElementById('airbnbUrl').focus();
 document.getElementById('maxGuests').value=2;document.getElementById('price').value=0;document.getElementById('cleaning').value=150;
 show('Cole o link do anúncio. Nesta primeira versão, o link será salvo e você poderá completar os dados; a importação automática de conteúdo/fotos será adicionada com segurança depois.','ok','formNotice');
 openModal();
}
async function toggleLoft(id, activate){
 const action=activate?'ativar':'desativar';
 if(!confirm(`Deseja ${action} este anúncio? ${activate?'Ele voltará a aparecer no site.':'Ele ficará oculto para novas reservas, mas permanecerá no painel.'}`)) return;
 try{
  await api('/admin/loft',{method:'POST',body:JSON.stringify({id,active:activate})});
  show(activate?'✅ Anúncio ativado.':'⏸ Anúncio desativado. Ele não aparecerá mais no site.','ok');
  await loadData();
 }catch(e){show('❌ '+e.message,'err')}
}
async function deleteLoft(id,name){
 if(!confirm(`Excluir permanentemente o anúncio${name?` "${name}"`:''}?\n\nEsta ação remove o anúncio e seus dados de calendário/preços. Se houver reservas vinculadas, o sistema bloqueará a exclusão para preservar o histórico.`)) return;
 try{
  await api('/admin/loft?id='+encodeURIComponent(id),{method:'DELETE'});
  show('🗑 Anúncio excluído permanentemente.','ok');
  await loadData();
 }catch(e){show('❌ '+e.message,'err')}
}
function photosSoon(){show('A área de fotos será ligada ao Supabase Storage na próxima etapa.','ok')}
function calendarSoon(){show('O calendário continua sendo gerenciado pela sincronização Airbnb. Vamos integrar o gerenciamento completo pelo painel na próxima etapa.','ok')}

async function showReservations(){
 try{
  const j=await api('/admin/reservations');
  reservations=j.reservations||[];
  const panel=document.getElementById('reservationsPanel');
  if(!reservations.length){
    panel.innerHTML='<div class="card"><h2>Solicitações de reserva</h2><div class="empty">Nenhuma solicitação encontrada.</div></div>';
    return;
  }
  panel.innerHTML=`<div class="card">
    <h2>Solicitações de reserva</h2>
    <div class="muted" style="margin-bottom:12px">Somente reservas com status <b>confirmada</b> bloqueiam as datas.</div>
    ${reservations.map(renderReservation).join('')}
  </div>`;
 }catch(e){show('❌ '+e.message,'err')}
}

function renderReservation(r){
 const guest=r.guests||{};
 const loft=r.lofts||{};
 const status=r.status||'pending';
 const statusLabel={pending:'Pendente',confirmed:'Confirmada',rejected:'Recusada',cancelled:'Cancelada'}[status]||status;
 const method=r.payment_method||'';
 const total=Number(r.total_amount||0).toFixed(2).replace('.',',');
 const ci=r.check_in?String(r.check_in).split('-').reverse().join('/'):''; 
 const co=r.check_out?String(r.check_out).split('-').reverse().join('/'):'';
 return `<div class="reservation ${esc(status)}">
   <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap">
    <div><b>#${esc(r.id||'')}</b> · <span class="badge">${esc(statusLabel)}</span></div>
    <b>R$ ${total}</b>
   </div>
   <div class="reservation-grid" style="margin-top:10px">
    <div><b>Loft:</b> ${esc(loft.name||r.loft_id||'')}</div>
    <div><b>Período:</b> ${esc(ci)} → ${esc(co)}</div>
    <div><b>Hóspede:</b> ${esc(guest.name||'')}</div>
    <div><b>WhatsApp:</b> ${esc(guest.phone||'')}</div>
    <div><b>E-mail:</b> ${esc(guest.email||'')}</div>
    <div><b>CPF:</b> ${esc(guest.document||'')}</div>
    <div><b>Hóspedes:</b> ${esc(r.guests_count||'')}</div>
    <div><b>Pagamento:</b> ${esc(method||'Aguardando')}</div>
   </div>
   ${r.notes?`<div class="muted" style="margin-top:8px"><b>Observações:</b> ${esc(r.notes)}</div>`:''}
   ${status==='pending'?`<div class="actions">
     <button class="primary" onclick="confirmReservation('${r.id}','pix')">✓ Confirmar — Pix</button>
     <button class="primary" onclick="confirmReservation('${r.id}','nubank')">✓ Confirmar — Nubank</button>
     <button class="danger" onclick="rejectReservation('${r.id}')">Recusar</button>
   </div>`:''}
 </div>`;
}

async function confirmReservation(id,method){
 if(!confirm('Confirma que o pagamento foi recebido e deseja bloquear estas datas?')) return;
 try{
  await api('/admin/reservation',{method:'PATCH',body:JSON.stringify({reservation_id:id,status:'confirmed',payment_method:method})});
  show('✅ Reserva confirmada. As datas agora ficam bloqueadas.','ok');
  await showReservations();
 }catch(e){show('❌ '+e.message,'err')}
}

async function rejectReservation(id){
 if(!confirm('Recusar esta solicitação? As datas continuarão disponíveis.')) return;
 try{
  await api('/admin/reservation',{method:'PATCH',body:JSON.stringify({reservation_id:id,status:'rejected'})});
  show('Solicitação recusada.','ok');
  await showReservations();
 }catch(e){show('❌ '+e.message,'err')}
}

function logout(){token='';localStorage.removeItem('lofts_prime_admin_token');showLogin();document.getElementById('status').textContent='Aguardando login';}
loadData();
</script>
</body></html>
