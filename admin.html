<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lofts Prime — Painel</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#20242a}
.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:#fff;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #0000000b}
h1{margin:0 0 6px}.muted{color:#68717d}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
input,textarea,button{width:100%;padding:12px;border:1px solid #d8dde3;border-radius:10px;font:inherit}
textarea{min-height:100px;resize:vertical}button{background:#111;color:#fff;border:0;cursor:pointer;font-weight:700}
button.secondary{background:#e9edf1;color:#20242a}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:10px;margin-top:12px}
.actions button{width:auto}.hidden{display:none}.status{padding:10px;border-radius:10px;background:#eef6ff;margin-top:12px}.error{background:#fff0f0;color:#a40000}
.price{font-size:24px;font-weight:700}.loft h2{margin-top:0}
@media(max-width:800px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.wrap{padding:12px}}
</style>
</head>
<body>
<div class="wrap">

<div id="loginCard" class="card" style="max-width:460px;margin:50px auto">
  <h1>Painel Lofts Prime</h1>
  <p class="muted">Acesso administrativo</p>
  <label>E-mail</label>
  <input id="email" type="email" autocomplete="username">
  <br><br>
  <label>Senha</label>
  <input id="password" type="password" autocomplete="current-password">
  <br><br>
  <button onclick="login()">Entrar</button>
  <div id="loginMsg"></div>
</div>

<div id="panel" class="hidden">
  <div class="card">
    <h1>Painel Lofts Prime</h1>
    <p class="muted">Edite os dados básicos dos seus lofts.</p>
    <div class="actions">
      <button onclick="loadData()">Atualizar dados</button>
      <button class="secondary" onclick="logout()">Sair</button>
    </div>
    <div id="msg"></div>
  </div>

  <div id="lofts" class="grid"></div>
</div>

</div>

<script>
const WORKER = "https://lofts-prime-sync.cristianohuttnerfischer.workers.dev";
let token = localStorage.getItem("lofts_prime_admin_token") || "";

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

function message(text,error=false){
  const el=document.getElementById("msg");
  el.className="status"+(error?" error":"");
  el.textContent=text;
}

async function login(){
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const out=document.getElementById("loginMsg");
  out.className="status";
  out.textContent="Entrando...";
  try{
    const r=await fetch(WORKER+"/admin/login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({email,password})
    });
    const d=await r.json();
    if(!r.ok || !d.ok) throw new Error(d.error||"Falha no login");
    token=d.access_token;
    localStorage.setItem("lofts_prime_admin_token",token);
    document.getElementById("loginCard").classList.add("hidden");
    document.getElementById("panel").classList.remove("hidden");
    await loadData();
  }catch(e){
    out.className="status error";
    out.textContent=e.message;
  }
}

function logout(){
  token="";
  localStorage.removeItem("lofts_prime_admin_token");
  document.getElementById("panel").classList.add("hidden");
  document.getElementById("loginCard").classList.remove("hidden");
}

async function api(path,options={}){
  options.headers={...(options.headers||{}),Authorization:"Bearer "+token,"Content-Type":"application/json"};
  const r=await fetch(WORKER+path,options);
  const d=await r.json();
  if(r.status===401){logout();throw new Error("Sessão expirada. Faça login novamente.");}
  if(!r.ok || !d.ok) throw new Error(d.error||"Erro");
  return d;
}

async function loadData(){
  try{
    message("Carregando...");
    const d=await api("/admin/data");
    const priceMap={};
    for(const p of d.prices||[]) priceMap[p.loft_id]=p.nightly_price;
    document.getElementById("lofts").innerHTML=(d.lofts||[]).map(l=>`
      <div class="card loft">
        <h2>${esc(l.name)}</h2>
        <p class="muted">${esc(l.location||"")}</p>

        <label>Nome</label>
        <input id="name-${l.id}" value="${esc(l.name)}">

        <br><br><label>Descrição</label>
        <textarea id="desc-${l.id}">${esc(l.description||"")}</textarea>

        <br><br><div class="row">
          <div>
            <label>Preço padrão / noite</label>
            <input id="price-${l.id}" type="number" min="0" step="1" value="${priceMap[l.id]??0}">
          </div>
          <div>
            <label>Taxa de limpeza</label>
            <input id="clean-${l.id}" type="number" min="0" step="1" value="${l.cleaning_fee??150}">
          </div>
        </div>

        <div class="actions">
          <button onclick="saveLoft('${l.id}')">Salvar alterações</button>
        </div>
      </div>
    `).join("");
    message("Dados carregados.");
  }catch(e){message(e.message,true);}
}

async function saveLoft(id){
  try{
    message("Salvando...");
    await api("/admin/loft",{
      method:"POST",
      body:JSON.stringify({
        loft_id:id,
        name:document.getElementById("name-"+id).value,
        description:document.getElementById("desc-"+id).value,
        cleaning_fee:Number(document.getElementById("clean-"+id).value)
      })
    });
    await api("/admin/price",{
      method:"POST",
      body:JSON.stringify({
        loft_id:id,
        nightly_price:Number(document.getElementById("price-"+id).value)
      })
    });
    message("Alterações salvas com sucesso.");
  }catch(e){message(e.message,true);}
}

if(token){
  document.getElementById("loginCard").classList.add("hidden");
  document.getElementById("panel").classList.remove("hidden");
  loadData();
}
</script>
</body>
</html>
